<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CF US Tariff Monitor</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212b;--muted:#69737d;--line:#e1e6ea;--ok:#18794e;--watch:#a15c00;--risk:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:#17202a;color:#fff;padding:24px 28px}header h1{margin:0 0 6px;font-size:26px}.sub{opacity:.72}.wrap{max-width:1250px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px #00000008}.label{font-size:12px;color:var(--muted)}.value{font-size:22px;font-weight:700;margin-top:7px}.ok{color:var(--ok)}.watch{color:var(--watch)}section{margin-top:22px}.title{font-size:18px;font-weight:700;margin-bottom:10px}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #e8ecef;font-size:14px;vertical-align:top}th{background:#eef1f4}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#eaf6ef;color:var(--ok)}.badge.w{background:#fff4df;color:var(--watch)}.badge.r{background:#fdecec;color:var(--risk)}.small{font-size:12px;color:var(--muted)}a{color:#185abc;text-decoration:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{border:1px solid #cfd6dc;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}button.active{background:#17202a;color:#fff}.event{cursor:pointer}.details{display:none;background:#fafbfc}.event.open+.details{display:table-row}.updated{float:right;font-size:12px;opacity:.7}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.updated{float:none;display:block;margin-top:8px}}
</style></head><body><header><h1>CF US Tariff Monitor</h1><div class="sub">White House / USTR / CBP / Federal Register → 自動查核 → 新事件判斷 → Dashboard</div></header><div class="wrap"><div id="cards" class="grid"></div><section><div class="title">本週重大事件</div><table><thead><tr><th>狀態</th><th>事件</th><th>日期</th></tr></thead><tbody id="events"></tbody></table></section><section><div class="title">產品影響矩陣</div><div class="controls"><button class="active" onclick="filterRows('all',this)">全部</button><button onclick="filterRows('china',this)">China COO</button><button onclick="filterRows('twvn',this)">TW / VN COO</button></div><table><thead><tr><th>產品線</th><th>COO</th><th>HTS / 關注點</th><th>狀態</th><th>行動</th></tr></thead><tbody id="products"></tbody></table></section><section><div class="title">措施控制面板</div><table><thead><tr><th>措施</th><th>狀態</th><th>CF 管理判斷</th></tr></thead><tbody id="measures"></tbody></table></section><section><div class="title">資料與自動化</div><div class="card"><b>最後查核：</b><span id="checked"></span><span class="updated">資料來源限官方原始文件</span><br><br><span id="automation"></span></div></section></div>
<script>
let DATA;
async function load(){try{DATA=await fetch('data.json?'+Date.now()).then(r=>r.json());render()}catch(e){document.body.innerHTML+='<p style="padding:30px">無法載入 data.json</p>'}}
function badge(s){let c=s==='WATCH'?' w':s==='RISK'?' r':'';return '<span class="badge'+c+'">'+s+'</span>'}
function render(){document.getElementById('cards').innerHTML=DATA.cards.map(x=>'<div class="card"><div class="label">'+x.label+'</div><div class="value '+(x.tone||'')+'">'+x.value+'</div></div>').join('');
document.getElementById('events').innerHTML=DATA.events.map((x,i)=>'<tr class="event" onclick="toggle('+i+')"><td>'+badge(x.status)+'</td><td><b>'+x.title+'</b><br>'+x.summary+'</td><td>'+x.date+'</td></tr><tr id="d'+i+'" class="details"><td colspan="3">'+x.detail+'<br><a href="'+x.url+'" target="_blank">官方原始文件</a></td></tr>').join('');
document.getElementById('products').innerHTML=DATA.products.map(x=>'<tr data-g="'+x.group+'"><td>'+x.product+'</td><td>'+x.coo+'</td><td>'+x.hts+'</td><td>'+badge(x.status)+'</td><td>'+x.action+'</td></tr>').join('');
document.getElementById('measures').innerHTML=DATA.measures.map(x=>'<tr><td>'+x.name+'</td><td>'+badge(x.status)+'</td><td>'+x.note+'</td></tr>').join('');
document.getElementById('checked').textContent=DATA.checked_at+'；來源數 '+DATA.sources.length;
document.getElementById('automation').textContent=DATA.automation_note;
}
function toggle(i){document.getElementById('d'+i).classList.toggle('open')}
function filterRows(g,b){document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('#products tr').forEach(r=>r.style.display=g==='all'||r.dataset.g===g?'':'none')}
load();
</script></body></html>
